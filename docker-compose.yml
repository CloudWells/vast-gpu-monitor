version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - vast_config:/root/.config/vastai
      - ./backend/data:/app/data
    environment:
      - APP_PASSWORD=${APP_PASSWORD:-change_me}
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-1050}:80"
    depends_on:
      - backend
    restart: always

volumes:
  vast_config: